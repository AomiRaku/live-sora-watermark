<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>live-sora-watermark</title>
  <style>
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      overflow: hidden; background-color: black; position: relative;
    }
    #activeGifContainer {
      position: absolute; pointer-events: none; z-index: 50; visibility: hidden;
      display: inline-block;
    }
    #activeGifContainer.gif-visible { visibility: visible; }
    #activeGifImage {
      display: block; object-fit: contain;
      /* 移除阴影效果 */
    }
    /* 文字样式 */
    .watermark-text {
      position: absolute; bottom: 0; color: white; pointer-events: none;
      line-height: 1.2; word-break: break-word; white-space: nowrap;
      z-index: 1;
    }
    /* 移除左右类的默认边距，完全由JavaScript控制 */
    .debug-safe-zone {
      position: absolute; border: 2px dashed rgba(255, 0, 0, 0.5);
      pointer-events: none; box-sizing: border-box; z-index: 0;
    }
    .debug-gif-border {
      outline: 2px solid rgba(0, 100, 255, 0.8); background: rgba(0, 100, 255, 0.1);
    }
  </style>
</head>
<body>

<div id="debugLayer" class="debug-safe-zone" style="display: none;"></div>
<div id="activeGifContainer">
  <img id="activeGifImage" src="" alt="Overlay">
  <div id="watermarkText" class="watermark-text"></div>
</div>

<script>
  // ==================================== 配置在此调整 ===========================================
  // ====================================== CONFIG ============================================

  const CONFIG = {
    text: "@im-not-sora",             // 水印下方文字                                      Watermark username text

    enableRandomPosition: false,      // false=固定循环(左上->右中->左下), true=随机模式   false = fixed cycle (top-left → middle-right → bottom-left), true = random mode
    sizeVh: 11,                       // GIF高度占比 (vh)                              GIF height ratio (vh)
    safeMarginPercent: 0,             // 两侧边距 (%)                                   Screen edge safe distance (%)
    opacity: 0.9,                     // 不透明度 (0.0 - 1.0）（1.0为不透明)              Opacity (0.0 - 1.0) (1.0 = fully opaque)

                        //以下不建议修改                                                 Modification not recommended ↓
    displayTime: 4000,                // 显示时长 (毫秒)（GIF长度的原因，不建议修改）        Display duration (ms) (Not recommended to modify due to GIF length)
    intervalTime: 0,                  // 切换空档时长 (毫秒)（GIF长度的原因，不建议修改）     Interval between switches (ms) (Not recommended to modify due to GIF length)
    debug: false,                     // 调试模式开关（正常使用不要开启）                   Debug mode switch (Do not enable for normal use)
    paths: {
      left: 'gif/001.gif',            // 左GIF路径                                     Left GIF path
      right: 'gif/002.gif'            // 右GIF路径                                     Right GIF path
    }
  };
  // ============================================================================================

  // --- 逻辑与状态 ---
  const state = { nextSideIsLeft: true, fixedIndex: 0 };
  const assetRatios = { left: 1, right: 1 };
  const container = document.getElementById('activeGifContainer');
  const image = document.getElementById('activeGifImage');
  const debugLayer = document.getElementById('debugLayer');
  const watermarkText = document.getElementById('watermarkText');

  // 从 URL 获取参数覆盖配置
  function overrideConfigFromUrl() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('random')) CONFIG.enableRandomPosition = params.get('random') === 'true';
    if (params.has('size')) CONFIG.sizeVh = Number(params.get('size'));
    if (params.has('margin')) CONFIG.safeMarginPercent = Number(params.get('margin'));
    if (params.has('opacity')) CONFIG.opacity = Number(params.get('opacity'));
    if (params.has('display')) CONFIG.displayTime = Number(params.get('display'));
    if (params.has('interval')) CONFIG.intervalTime = Number(params.get('interval'));
    if (params.has('debug')) CONFIG.debug = params.get('debug') === 'true';
    if (params.has('text')) CONFIG.text = params.get('text');
    if (params.has('left')) CONFIG.paths.left = params.get('left');
    if (params.has('right')) CONFIG.paths.right = params.get('right');
  }

  // 初始化样式
  function initStyles() {
    overrideConfigFromUrl();
    image.style.height = `${CONFIG.sizeVh}vh`;
    image.style.opacity = CONFIG.opacity;
    // 让水印文字透明度也跟随统一设置
    watermarkText.style.opacity = CONFIG.opacity;
    watermarkText.textContent = CONFIG.text;

    // 设置容器为相对定位，使文字能基于容器定位
    container.style.position = 'relative';

    // 调试模式设置
    if (CONFIG.debug) {
      const margin = CONFIG.safeMarginPercent ?? 0;
      debugLayer.style.display = 'block';
      debugLayer.style.top = `${margin}vh`; debugLayer.style.left = `${margin}vw`;
      debugLayer.style.width = `${100 - margin * 2}vw`; debugLayer.style.height = `${100 - margin * 2}vh`;
      container.classList.add('debug-gif-border');
    }
  }

  // 预加载资源并计算比例
  function preloadAssets() {
    const loadPromise = (path, key) => new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { if (img.naturalHeight > 0) assetRatios[key] = img.naturalWidth / img.naturalHeight; resolve(); };
      img.onerror = () => resolve();
      img.src = path;
    });
    return Promise.all([loadPromise(CONFIG.paths.left, 'left'), loadPromise(CONFIG.paths.right, 'right')]);
  }

  // 计算并设置位置
  function calculateAndSetPosition() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const isLeftCurrent = CONFIG.enableRandomPosition ? state.nextSideIsLeft : (state.fixedIndex !== 1);
    
    const currentRatio = isLeftCurrent ? assetRatios.left : assetRatios.right;
    const currentPath = isLeftCurrent ? CONFIG.paths.left : CONFIG.paths.right;
    
    const gifHeight = vh * (CONFIG.sizeVh / 100);
    const gifWidth = gifHeight * currentRatio;
    const marginPercent = CONFIG.safeMarginPercent ?? 0;
    const marginX = vw * (marginPercent / 100); 
    const marginY = vh * (marginPercent / 100);

    // 设置GIF图片
    image.src = currentPath;
    
    // 设置文字样式和位置
    const textSize = gifHeight / 5; // 字体大小为gif高度的五分之一
    const textMargin = gifHeight; // 文字水平边距与gif高度相同
    const textMarginBottom = gifHeight / 6; // 文字底边距为gif高度的六分之一
    
    watermarkText.style.fontSize = `${textSize}px`;
    watermarkText.style.bottom = `${textMarginBottom}px`;
    // 确保文字透明度与GIF一致
    watermarkText.style.opacity = CONFIG.opacity;
    
    // 移除可能存在的left/right样式
    watermarkText.style.left = '';
    watermarkText.style.right = '';
    watermarkText.style.textAlign = '';
    
    if (isLeftCurrent) {
      // 左侧水印：左对齐，左边距与gif高度相同
      watermarkText.style.left = `${textMargin}px`;
      watermarkText.style.textAlign = 'left';
    } else {
      // 右侧水印：右对齐，右边距与gif高度相同
      watermarkText.style.right = `${textMargin}px`;
      watermarkText.style.textAlign = 'right';
    }

    // 设置容器尺寸以适应GIF
    container.style.width = `${gifWidth}px`;
    container.style.height = `${gifHeight}px`;

    if (CONFIG.enableRandomPosition) {
      const minY = marginY, maxY = vh - gifHeight - marginY;
      const randomTop = minY + Math.random() * Math.max(0, maxY - minY);
      const centerX = vw / 2;
      let minX, maxX;

      if (isLeftCurrent) { minX = marginX; maxX = centerX - gifWidth - marginX; }
      else { minX = centerX + marginX; maxX = vw - gifWidth - marginX; }

      // 防溢出计算
      container.style.left = (maxX < minX) 
        ? `${(isLeftCurrent ? 0 : centerX) + (vw/2 - gifWidth)/2}px` 
        : `${minX + Math.random() * (maxX - minX)}px`;
      container.style.top = `${randomTop}px`;
      state.nextSideIsLeft = !state.nextSideIsLeft;

    } else {
      switch (state.fixedIndex) {
        case 0: container.style.left = `${marginX}px`; container.style.top = `${marginY}px`; break;
        case 1: container.style.left = `${vw - gifWidth - marginX}px`; container.style.top = `${(vh - gifHeight)/2}px`; break;
        case 2: container.style.left = `${marginX}px`; container.style.top = `${vh - gifHeight - marginY}px`; break;
      }
      state.fixedIndex = (state.fixedIndex + 1) % 3;
    }
  }

  // 延迟工具函数
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  // 动画主循环
  async function startLoop() {
    while (true) {
      try {
        calculateAndSetPosition();
        container.classList.remove('gif-visible'); container.style.visibility = 'visible'; container.classList.add('gif-visible');
        await delay(CONFIG.displayTime);
        container.style.visibility = 'hidden'; container.classList.remove('gif-visible');
        await delay(CONFIG.intervalTime);
      } catch (e) { console.error(e); await delay(1000); }
    }
  }

  // 页面加载完成后启动
  window.addEventListener('load', async () => { 
    initStyles(); 
    await preloadAssets(); 
    startLoop(); 
  });
</script>
</body>
</html>
